<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101214">
  <title>MARCUS Visualizer Demo</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101214;
      --panel: #171a1d;
      --panel-soft: #1d2226;
      --line: #30363d;
      --line-soft: rgba(255,255,255,0.075);
      --text: #f3f0e9;
      --muted: #a9ada9;
      --faint: #737b80;
      --cyan: #55d7e6;
      --green: #6bd391;
      --amber: #e3b258;
      --red: #ee756e;
      --violet: #b9a5ff;
      --blue: #80b9ff;
      --shadow: 0 20px 70px rgba(0, 0, 0, 0.42);
      --radius: 8px;
      --mono: "SFMono-Regular", "Cascadia Code", "Roboto Mono", Consolas, monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background:
        linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px),
        linear-gradient(135deg, #101214 0%, #17191a 48%, #111518 100%);
      background-size: 36px 36px, 36px 36px, auto;
      color: var(--text);
      font-family: var(--sans);
      letter-spacing: 0;
    }

    button {
      font: inherit;
    }

    .app-shell {
      display: grid;
      grid-template-rows: 58px minmax(0, 1fr);
      min-height: 100vh;
      padding: 10px;
      gap: 10px;
    }

    .topbar,
    .panel {
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: rgba(23, 26, 29, 0.86);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .topbar {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr) 330px;
      align-items: center;
      padding: 0 14px;
      gap: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mark {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid rgba(85,215,230,0.72);
      background:
        linear-gradient(90deg, transparent 47%, rgba(85,215,230,0.9) 48%, rgba(85,215,230,0.9) 52%, transparent 53%),
        linear-gradient(0deg, transparent 47%, rgba(85,215,230,0.5) 48%, rgba(85,215,230,0.5) 52%, transparent 53%),
        radial-gradient(circle, rgba(85,215,230,0.22), rgba(85,215,230,0.04));
      box-shadow: 0 0 24px rgba(85,215,230,0.2);
    }

    .brand h1 {
      margin: 0;
      font-size: 15px;
      line-height: 1.1;
      font-weight: 750;
    }

    .brand p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
    }

    .system-strip,
    .top-actions,
    .task-meta,
    .feed-meta,
    .stale-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .system-strip {
      justify-content: center;
      flex-wrap: wrap;
    }

    .top-actions {
      justify-content: flex-end;
    }

    .chip,
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 28px;
      padding: 0 10px;
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255,255,255,0.035);
      font-size: 12px;
      white-space: nowrap;
    }

    .chip strong,
    .pill strong {
      color: var(--text);
      font-weight: 650;
    }

    .pulse-dot,
    .mini-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .pulse-dot {
      color: var(--green);
      box-shadow: 0 0 0 0 rgba(107,211,145,0.48);
      animation: beat 2.2s infinite;
    }

    @keyframes beat {
      0% { box-shadow: 0 0 0 0 rgba(107,211,145,0.45); }
      70% { box-shadow: 0 0 0 9px rgba(107,211,145,0); }
      100% { box-shadow: 0 0 0 0 rgba(107,211,145,0); }
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      display: inline-grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 8px;
      color: var(--muted);
      background: rgba(255,255,255,0.035);
      cursor: pointer;
    }

    .icon-btn:hover,
    .icon-btn.active {
      color: var(--text);
      border-color: rgba(85,215,230,0.48);
      background: rgba(85,215,230,0.09);
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(540px, 1fr) 410px;
      gap: 10px;
      min-height: 0;
    }

    .panel {
      min-height: 0;
      overflow: hidden;
    }

    .panel-header {
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 14px;
      border-bottom: 1px solid rgba(255,255,255,0.075);
      background: rgba(255,255,255,0.025);
    }

    .panel-title {
      margin: 0;
      font-size: 12px;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #ddd9cf;
    }

    .panel-count {
      color: var(--faint);
      font-family: var(--mono);
      font-size: 11px;
    }

    .queue-panel {
      display: grid;
      grid-template-rows: 45px minmax(0, 1fr) 180px;
    }

    .project-list {
      overflow: auto;
      padding: 12px;
    }

    .project-card {
      border: 1px solid rgba(255,255,255,0.085);
      border-radius: 8px;
      background: rgba(255,255,255,0.035);
      margin-bottom: 10px;
      overflow: hidden;
    }

    .project-card.selected {
      border-color: rgba(85,215,230,0.42);
      background: rgba(85,215,230,0.055);
    }

    .project-head {
      width: 100%;
      min-height: 70px;
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) auto;
      align-items: center;
      gap: 11px;
      border: 0;
      color: inherit;
      background: transparent;
      text-align: left;
      padding: 12px;
      cursor: pointer;
    }

    .project-state {
      width: 12px;
      height: 42px;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 0 22px rgba(107,211,145,0.24);
    }

    .project-state.active { background: var(--cyan); animation: workPulse 2.4s infinite; }
    .project-state.waiting { background: var(--amber); box-shadow: 0 0 22px rgba(227,178,88,0.24); }
    .project-state.blocked { background: var(--red); box-shadow: 0 0 22px rgba(238,117,110,0.26); }
    .project-state.stale { background: var(--faint); box-shadow: none; opacity: 0.75; }

    @keyframes workPulse {
      0%, 100% { transform: scaleY(0.82); opacity: 0.85; }
      50% { transform: scaleY(1); opacity: 1; }
    }

    .project-name {
      margin: 0;
      font-size: 16px;
      line-height: 1.16;
      font-weight: 780;
    }

    .project-summary {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .project-metrics {
      display: grid;
      grid-template-columns: repeat(3, 58px);
      gap: 7px;
    }

    .metric {
      border: 1px solid rgba(255,255,255,0.075);
      border-radius: 8px;
      background: rgba(0,0,0,0.14);
      padding: 8px 6px;
      text-align: center;
    }

    .metric b {
      display: block;
      font-family: var(--mono);
      font-size: 17px;
      line-height: 1;
    }

    .metric span {
      display: block;
      margin-top: 5px;
      color: var(--faint);
      font-size: 10px;
    }

    .task-stack {
      display: grid;
      gap: 8px;
      padding: 0 12px 12px 42px;
    }

    .task-row-card {
      border: 1px solid rgba(255,255,255,0.075);
      border-radius: 8px;
      background: rgba(0,0,0,0.16);
      overflow: hidden;
    }

    .task-toggle {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 12px;
      border: 0;
      color: inherit;
      background: transparent;
      text-align: left;
      padding: 11px;
      cursor: pointer;
    }

    .task-name {
      margin: 0;
      font-size: 13px;
      line-height: 1.22;
      font-weight: 720;
    }

    .task-now {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .task-meta {
      margin-top: 8px;
      color: var(--faint);
      font-family: var(--mono);
      font-size: 10px;
      flex-wrap: wrap;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      height: 21px;
      border-radius: 999px;
      padding: 0 8px;
      border: 1px solid currentColor;
      font-size: 10px;
      font-weight: 760;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .badge-active { color: var(--cyan); }
    .badge-waiting { color: var(--amber); }
    .badge-blocked { color: var(--red); }
    .badge-review { color: var(--violet); }
    .badge-done { color: var(--green); }
    .badge-stale { color: var(--faint); }

    .codex-detail {
      display: none;
      border-top: 1px solid rgba(255,255,255,0.065);
      padding: 11px;
      background: rgba(255,255,255,0.025);
    }

    .task-row-card.open .codex-detail {
      display: block;
    }

    .codex-detail p {
      margin: 0 0 9px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .steps {
      display: grid;
      gap: 7px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .steps li {
      display: grid;
      grid-template-columns: 9px minmax(0, 1fr);
      gap: 9px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .steps li::before {
      content: "";
      width: 7px;
      height: 7px;
      margin-top: 5px;
      border-radius: 50%;
      background: var(--cyan);
    }

    .work-feed {
      border-top: 1px solid rgba(255,255,255,0.075);
      background: rgba(0,0,0,0.18);
      overflow: hidden;
      display: grid;
      grid-template-rows: 38px minmax(0, 1fr);
    }

    .feed-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      color: #ddd9cf;
      font-size: 11px;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .feed-list {
      overflow: auto;
      padding: 0 12px 12px;
    }

    .feed-item {
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr);
      gap: 10px;
      padding: 8px 0;
      border-top: 1px solid rgba(255,255,255,0.052);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .feed-item time {
      color: var(--faint);
      font-family: var(--mono);
      font-size: 10px;
      padding-top: 2px;
    }

    .side-panel {
      display: grid;
      grid-template-rows: 45px 168px minmax(0, 1fr) 178px;
    }

    .brain-widget {
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr);
      gap: 14px;
      align-items: center;
      padding: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.075);
      background: rgba(0,0,0,0.12);
    }

    .brain-shape {
      width: 86px;
      height: 86px;
      border: 1px solid rgba(85,215,230,0.34);
      border-radius: 28% 42% 33% 45%;
      background:
        radial-gradient(circle at 62% 32%, rgba(227,178,88,0.55), transparent 14%),
        radial-gradient(circle at 34% 58%, rgba(85,215,230,0.5), transparent 17%),
        linear-gradient(135deg, rgba(85,215,230,0.12), rgba(185,165,255,0.12));
      box-shadow: inset 0 0 26px rgba(85,215,230,0.12), 0 0 28px rgba(85,215,230,0.16);
      animation: brainIdle 4.2s ease-in-out infinite;
    }

    .brain-shape.active { border-color: rgba(85,215,230,0.72); animation-duration: 2.1s; }
    .brain-shape.waiting { border-color: rgba(227,178,88,0.75); filter: saturate(0.95); animation-duration: 3.7s; }
    .brain-shape.blocked { border-color: rgba(238,117,110,0.85); animation: brainAlert 1.4s ease-in-out infinite; }

    @keyframes brainIdle {
      0%, 100% { border-radius: 28% 42% 33% 45%; transform: rotate(-2deg) scale(0.98); }
      50% { border-radius: 41% 30% 45% 31%; transform: rotate(2deg) scale(1.02); }
    }

    @keyframes brainAlert {
      0%, 100% { transform: scale(0.98); box-shadow: inset 0 0 26px rgba(238,117,110,0.12), 0 0 18px rgba(238,117,110,0.12); }
      50% { transform: scale(1.03); box-shadow: inset 0 0 28px rgba(238,117,110,0.18), 0 0 34px rgba(238,117,110,0.24); }
    }

    .brain-copy h3 {
      margin: 0;
      font-size: 15px;
      line-height: 1.2;
    }

    .brain-copy p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.42;
    }

    .brief-body {
      overflow: auto;
      padding: 14px;
    }

    .brief-kicker {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 11px;
    }

    .brief-title {
      margin: 0;
      font-size: 22px;
      line-height: 1.12;
      font-weight: 820;
    }

    .brief-summary {
      margin: 9px 0 15px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.48;
    }

    .brief-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .fact,
    .stale-card {
      border: 1px solid rgba(255,255,255,0.075);
      border-radius: 8px;
      background: rgba(255,255,255,0.03);
      padding: 10px;
      min-width: 0;
    }

    .fact span,
    .stale-card span {
      display: block;
      color: var(--faint);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 6px;
    }

    .fact strong,
    .stale-card strong {
      display: block;
      color: var(--text);
      font-size: 12px;
      line-height: 1.3;
      font-weight: 650;
    }

    .plain-list {
      margin: 13px 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 8px;
    }

    .plain-list li {
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.42;
    }

    .stale-section {
      border-top: 1px solid rgba(255,255,255,0.075);
      padding: 12px;
      background: rgba(0,0,0,0.14);
      overflow: auto;
    }

    .stale-section h3 {
      margin: 0 0 10px;
      color: #ddd9cf;
      font-size: 11px;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .stale-list {
      display: grid;
      gap: 8px;
    }

    .stale-card {
      opacity: 0.82;
    }

    .stale-meta {
      margin-top: 8px;
      color: var(--faint);
      font-family: var(--mono);
      font-size: 10px;
      flex-wrap: wrap;
    }

    .density-compact .project-head { min-height: 58px; padding: 10px; }
    .density-compact .task-stack { gap: 6px; }
    .density-compact .task-toggle,
    .density-compact .codex-detail,
    .density-compact .brief-body { padding: 10px; }

    }

        linear-gradient(135deg, rgba(85,215,230,0.08), rgba(185,165,255,0.08));
      box-shadow: none;
    }

    .brain-copy h3 {
      font-size: 13px;
      font-weight: 700;
    }

    .brain-copy p {
      margin-top: 5px;
      font-size: 11px;
      line-height: 1.36;
      color: #a3aaa9;
    }

    .brief-body {
      padding: 12px;
    }

    .brief-kicker {
      margin-bottom: 10px;
    }

    .brief-title {
      font-size: 18px;
      font-weight: 760;
    }

    .brief-summary {
      margin: 7px 0 12px;
      color: #a7adac;
    }

    .brief-grid {
      grid-template-columns: 1fr;
      gap: 0;
      border-top: 1px solid rgba(255,255,255,0.055);
    }

    .fact,
    .stale-card {
      border: 0;
      border-bottom: 1px solid rgba(255,255,255,0.055);
      border-radius: 0;
      background: transparent;
      padding: 8px 0;
    }

    .fact span,
    .stale-card span {
      margin-bottom: 4px;
      font-size: 9px;
      letter-spacing: 0.06em;
    }

    .fact strong,
    .stale-card strong {
      font-size: 11px;
      font-weight: 660;
    }

    .plain-list {
      margin-top: 9px;
      gap: 0;
    }

    .plain-list li {
      padding-top: 7px;
      padding-bottom: 7px;
      border-top-color: rgba(255,255,255,0.045);
    }

    .stale-section {
      padding: 10px 12px;
      background: rgba(0,0,0,0.08);
      border-top-color: rgba(255,255,255,0.055);
    }

    .stale-section h3 {
      margin-bottom: 7px;
      font-size: 10px;
      font-weight: 680;
      letter-spacing: 0.045em;
      color: #c7cecb;
    }

    .stale-list {
      gap: 0;
    }

    .stale-card {
      opacity: 0.75;
    }

    .stale-meta {
      margin-top: 5px;
      font-size: 9px;
      color: #747e83;
    }

    @media (max-width: 1120px) {
      body { overflow: auto; }
      .app-shell { height: auto; }
      .topbar { grid-template-columns: 1fr; height: auto; padding: 12px; }
      .system-strip,
      .top-actions { justify-content: flex-start; }
      .workspace { grid-template-columns: 1fr; }
      .queue-panel { min-height: 760px; }
      .side-panel { min-height: 760px; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand" aria-label="MARCUS Visualizer">
        <div class="mark" aria-hidden="true"></div>
        <div>
          <h1>MARCUS Visualizer</h1>
          <p>Live Codex queue</p>
        </div>
      </div>

      <div class="system-strip" aria-label="System status">
        <span class="chip"><span class="pulse-dot"></span><strong>3</strong> active</span>
        <span class="chip"><strong>1</strong> waiting</span>
        <span class="chip"><strong>2</strong> cooling</span>
      </div>

      <div class="top-actions" aria-label="Display controls">
        <button class="icon-btn active" type="button" title="Queue view" aria-label="Queue view">Q</button>
        <button class="icon-btn" type="button" title="Feed view" aria-label="Feed view">F</button>
        <button class="icon-btn" type="button" title="Compact density" aria-label="Compact density" id="densityToggle">C</button>
      </div>
    </header>

    <section class="workspace" aria-label="MARCUS operator console">
      <section class="panel queue-panel">
        <div class="panel-header">
          <h2 class="panel-title">Project Queue</h2>
          <span class="panel-count" id="queueCount">00 projects</span>
        </div>

        <div class="project-list" id="projectList" aria-label="Tracked Codex projects"></div>

        <section class="work-feed" aria-label="Active work feed">
          <div class="feed-title">
            <span>Active Work Feed</span>
            <span class="panel-count" id="feedClock">00:00</span>
          </div>
          <div class="feed-list" id="feedList"></div>
        </section>
      </section>

      <aside class="panel side-panel">
        <div class="panel-header">
          <h2 class="panel-title">At A Glance</h2>
          <span class="panel-count" id="briefClock">00:00</span>
        </div>

        <section class="brain-widget" aria-label="Obsidian memory state">
          <div class="brain-shape active" id="brainShape" aria-hidden="true"></div>
          <div class="brain-copy">
            <h3 id="brainTitle">Memory is warm</h3>
            <p id="brainCopy">Small, active, and current. The shape is moving because Marcus has recent project context attached to live Codex work.</p>
          </div>
        </section>

        <div class="brief-body" id="briefBody" aria-live="polite"></div>

        <section class="stale-section" aria-label="Decaying projects">
          <h3>Cooling Down</h3>
          <div class="stale-list" id="staleList"></div>
        </section>
      </aside>
    </section>
  </main>

  <script>
    const projects = [
      {
        id: "freedom",
        name: "Freedom Scoopers",
        state: "active",
        summary: "Quote flow polish and deployment safety are active in Codex.",
        updated: "2 min ago",
        health: "Working",
        memory: "warm",
        tasks: [
          {
            id: "arrival-copy",
            name: "Mobile quote arrival screen",
            status: "active",
            owner: "Codex",
            elapsed: "14m",
            now: "Codex is checking the small-phone layout after tightening the arrival copy.",
            detail: "The useful translation is simple: it is reading the page like a customer would, looking for text crowding, missed buttons, and copy that sounds awkward before anything ships.",
            steps: [
              "Reviewed the mobile screenshot and OCR output for the arrival step.",
              "Found that the primary action is readable, but the supporting line is too dense.",
              "Preparing a spacing change and then rerunning the mobile audit."
            ]
          },
          {
            id: "deployment-guard",
            name: "Quote deployment guard",
            status: "waiting",
            owner: "Marcus",
            elapsed: "31m",
            now: "Waiting for exact production approval before publishing quote-flow changes.",
            detail: "No deploy is happening in the background. Marcus has the target and expected result staged, but the production action is parked until Mark approves that exact change.",
            steps: [
              "Confirmed this is a production-impacting action.",
              "Separated code review from deploy approval.",
              "Holding the publish step outside Codex until explicitly authorized."
            ]
          }
        ]
      },
      {
        id: "marcus-core",
        name: "Marcus Core",
        state: "active",
        summary: "Desktop Codex monitoring and operator language are being shaped into a readable control surface.",
        updated: "5 min ago",
        health: "Working",
        memory: "warm",
        tasks: [
          {
            id: "visualizer-demo",
            name: "Visualizer demo direction",
            status: "active",
            owner: "Codex",
            elapsed: "8m",
            now: "Codex is converting the graph concept into a project-and-task queue.",
            detail: "This is the current design pass. The goal is not a technical topology; it is a control board that tells Mark what is being worked, what is waiting, what is blocked, and what Codex is actually doing in normal language.",
            steps: [
              "Removed the large system graph as the main mental model.",
              "Moved tracked projects to the top-level queue.",
              "Added expandable task rows with human-readable Codex activity."
            ]
          },
          {
            id: "pc-bridge",
            name: "Desktop PC bridge follow-up",
            status: "review",
            owner: "Marcus",
            elapsed: "1h 2m",
            now: "Reviewing completed bridge evidence before the next real integration step.",
            detail: "The bridge is not the thing being built here; it is context. Marcus is keeping the proof close so future Codex work does not drift from the accepted PC control boundaries.",
            steps: [
              "Loaded the latest accepted PC bridge evidence.",
              "Checked that deploy, repo creation, and desktop access still require explicit approval.",
              "Ready to turn this into live visualizer data once the demo locks."
            ]
          }
        ]
      },
      {
        id: "reggie",
        name: "Reggie",
        state: "blocked",
        summary: "A runner-side PR exists, but attention is needed before more automation piles on.",
        updated: "18 min ago",
        health: "Needs Mark",
        memory: "hot",
        tasks: [
          {
            id: "runner-pr",
            name: "Runner PR follow-through",
            status: "blocked",
            owner: "GitHub Actions",
            elapsed: "42m",
            now: "Blocked on review direction for the open runner PR.",
            detail: "Codex has a branch and PR trail. The next useful move is a human decision: keep the branch direction, revise it, or close it before Marcus launches more runner work.",
            steps: [
              "Captured the open PR and branch context.",
              "Stopped short of treating open PR state as completed work.",
              "Waiting for Mark's direction before the next action."
            ]
          }
        ]
      }
    ];

    const staleProjects = [
      {
        name: "Marcus Operator Demo Worker",
        last: "Yesterday",
        reason: "Accepted and quiet after deploy verification.",
        decay: "cool"
      },
      {
        name: "Knowledge Base cleanup",
        last: "2 days ago",
        reason: "Useful context, but no active Codex job attached.",
        decay: "cold"
      }
    ];

    const feed = [
      ["now", "Visualizer demo changed from graph-first to queue-first."],
      ["2m", "Codex activity text was rewritten into plain operational language."],
      ["5m", "Marcus Core stayed active because the demo direction is still being shaped."],
      ["14m", "Freedom Scoopers quote task continued mobile layout review."],
      ["18m", "Reggie moved to blocked until the open PR direction is decided."]
    ];

    let selectedProjectId = "marcus-core";
    let selectedTaskId = "visualizer-demo";

    const projectList = document.getElementById("projectList");
    const briefBody = document.getElementById("briefBody");
    const brainShape = document.getElementById("brainShape");
    const brainTitle = document.getElementById("brainTitle");
    const brainCopy = document.getElementById("brainCopy");

    function statusClass(status) {
      return {
        active: "badge-active",
        waiting: "badge-waiting",
        blocked: "badge-blocked",
        review: "badge-review",
        done: "badge-done",
        stale: "badge-stale"
      }[status] || "badge-active";
    }

    function getSelectedProject() {
      return projects.find(project => project.id === selectedProjectId) || projects[0];
    }

    function getSelectedTask() {
      const project = getSelectedProject();
      return project.tasks.find(task => task.id === selectedTaskId) || project.tasks[0];
    }

    function renderProjects() {
      document.getElementById("queueCount").textContent = `${projects.length.toString().padStart(2, "0")} projects`;
      projectList.innerHTML = projects.map(project => {
        const isSelected = project.id === selectedProjectId;
        const activeCount = project.tasks.filter(task => task.status === "active").length;
        const waitingCount = project.tasks.filter(task => task.status === "waiting").length;
        const blockedCount = project.tasks.filter(task => task.status === "blocked").length;
        return `
          <article class="project-card ${isSelected ? "selected" : ""}">
            <button class="project-head" type="button" data-project="${project.id}">
              <span class="project-state ${project.state}" aria-hidden="true"></span>
              <span>
                <h3 class="project-name">${project.name}</h3>
                <p class="project-summary">${project.summary}</p>
              </span>
              <span class="project-metrics">
                <span class="metric"><b style="color: var(--cyan)">${activeCount}</b><span>Active</span></span>
                <span class="metric"><b style="color: var(--amber)">${waitingCount}</b><span>Wait</span></span>
                <span class="metric"><b style="color: var(--red)">${blockedCount}</b><span>Block</span></span>
              </span>
            </button>
            <div class="task-stack">
              ${project.tasks.map(task => `
                <article class="task-row-card ${task.id === selectedTaskId ? "open" : ""}">
                  <button class="task-toggle" type="button" data-project="${project.id}" data-task="${task.id}">
                    <span>
                      <h4 class="task-name">${task.name}</h4>
                      <p class="task-now">${task.now}</p>
                      <span class="task-meta">
                        <span>${task.owner}</span>
                        <span>${task.elapsed}</span>
                      </span>
                    </span>
                    <span class="status-badge ${statusClass(task.status)}">${task.status}</span>
                  </button>
                  <div class="codex-detail">
                    <p>${task.detail}</p>
                    <ol class="steps">
                      ${task.steps.map(step => `<li>${step}</li>`).join("")}
                    </ol>
                  </div>
                </article>
              `).join("")}
            </div>
          </article>
        `;
      }).join("");

      projectList.querySelectorAll("[data-project]").forEach(button => {
        button.addEventListener("click", () => {
          selectedProjectId = button.dataset.project;
          if (button.dataset.task) selectedTaskId = button.dataset.task;
          else selectedTaskId = getSelectedProject().tasks[0].id;
          renderAll();
        });
      });
    }

    function renderBrief() {
      const project = getSelectedProject();
      const task = getSelectedTask();
      briefBody.innerHTML = `
        <div class="brief-kicker">
          <span class="status-badge ${statusClass(task.status)}">${task.status}</span>
          <span class="pill">${project.health}</span>
        </div>
        <h2 class="brief-title">${task.name}</h2>
        <p class="brief-summary">${task.detail}</p>
        <div class="brief-grid">
          <div class="fact"><span>Project</span><strong>${project.name}</strong></div>
          <div class="fact"><span>Current</span><strong>${task.now}</strong></div>
          <div class="fact"><span>Worker</span><strong>${task.owner}</strong></div>
          <div class="fact"><span>Age</span><strong>${task.elapsed}</strong></div>
        </div>
        <ol class="plain-list">
          ${task.steps.map(step => `<li>${step}</li>`).join("")}
        </ol>
      `;
    }

    function renderBrain() {
      const project = getSelectedProject();
      const state = project.state === "blocked" ? "blocked" : project.state === "waiting" ? "waiting" : "active";
      brainShape.className = `brain-shape ${state}`;
      if (state === "blocked") {
        brainTitle.textContent = "Memory is hot";
        brainCopy.textContent = "Angular shape, red edge, faster pulse. Marcus has context, but a human decision is holding the useful next move.";
      } else if (state === "waiting") {
        brainTitle.textContent = "Memory is waiting";
        brainCopy.textContent = "Amber edge and slower motion. Context is present, but the work is paused on an outside input.";
      } else {
        brainTitle.textContent = "Memory is warm";
        brainCopy.textContent = "Soft shape, blue edge, steady motion. Marcus has recent context attached to active Codex work.";
      }
    }

    function renderFeed() {
      document.getElementById("feedList").innerHTML = feed.map(([time, text]) => `
        <div class="feed-item"><time>${time}</time><span>${text}</span></div>
      `).join("");
    }

    function renderStale() {
      document.getElementById("staleList").innerHTML = staleProjects.map(project => `
        <article class="stale-card">
          <span>${project.last}</span>
          <strong>${project.name}</strong>
          <div class="stale-meta">
            <span>${project.decay}</span>
            <span>${project.reason}</span>
          </div>
        </article>
      `).join("");
    }

    function tickClock() {
      const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      document.getElementById("briefClock").textContent = time;
      document.getElementById("feedClock").textContent = time;
    }

    function renderAll() {
      renderProjects();
      renderBrief();
      renderBrain();
      renderFeed();
      renderStale();
    }

    document.getElementById("densityToggle").addEventListener("click", event => {
      document.body.classList.toggle("density-compact");
      event.currentTarget.classList.toggle("active");
    });

    renderAll();
    tickClock();
    setInterval(tickClock, 1000);
  </script>
</body>
</html>
