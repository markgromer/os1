<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Marcus Codex Run</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #071018; color: #eaf2f6; }
    header { min-height: 76px; padding: 18px 28px; border-bottom: 1px solid #263a46; display: flex; align-items: center; justify-content: space-between; gap: 24px; background: #0b1720; }
    h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: 0; }
    .subtitle { margin-top: 4px; color: #9bb0bc; font-size: 13px; }
    .status { display: inline-flex; align-items: center; gap: 9px; min-width: 128px; justify-content: center; border: 1px solid #36505e; padding: 9px 13px; border-radius: 6px; text-transform: capitalize; font-weight: 650; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #e1a13b; }
    .completed .dot { background: #35d58a; }
    .failed .dot, .cancelled .dot { background: #f06969; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) 330px; min-height: calc(100vh - 76px); }
    .activity { padding: 24px 28px; min-width: 0; }
    .activity h2, aside h2 { margin: 0 0 16px; font-size: 14px; text-transform: uppercase; color: #9bb0bc; }
    #events { display: flex; flex-direction: column; gap: 8px; }
    .event { display: grid; grid-template-columns: 96px 210px minmax(0, 1fr); gap: 14px; padding: 11px 12px; border-bottom: 1px solid #1c303b; font: 13px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .event time { color: #78909d; }
    .event strong { color: #51d3c7; overflow-wrap: anywhere; }
    .event pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; color: #cedbe1; font: inherit; }
    aside { border-left: 1px solid #263a46; background: #0b1720; padding: 24px; }
    dl { margin: 0; display: grid; gap: 16px; }
    dt { color: #78909d; font-size: 12px; margin-bottom: 4px; }
    dd { margin: 0; color: #eaf2f6; font-size: 14px; overflow-wrap: anywhere; }
    #final { margin-top: 26px; padding-top: 22px; border-top: 1px solid #263a46; white-space: pre-wrap; line-height: 1.55; }
    .empty { color: #78909d; padding: 40px 12px; }
    @media (max-width: 850px) { main { grid-template-columns: 1fr; } aside { border-left: 0; border-top: 1px solid #263a46; } .event { grid-template-columns: 78px minmax(100px, 0.4fr) 1fr; } }
  </style>
</head>
<body>
  <header>
    <div><h1 id="title">Marcus Codex Run</h1><div class="subtitle" id="workspace">Connecting to the local job</div></div>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">connecting</span></div>
  </header>
  <main>
    <section class="activity"><h2>Live Activity</h2><div id="events"><div class="empty">Waiting for Codex events...</div></div><div id="final"></div></section>
    <aside><h2>Run Details</h2><dl>
      <div><dt>Operation</dt><dd id="operation">-</dd></div>
      <div><dt>Project</dt><dd id="project">-</dd></div>
      <div><dt>Repository</dt><dd id="repository">-</dd></div>
      <div><dt>Branch</dt><dd id="branch">-</dd></div>
      <div><dt>Started</dt><dd id="started">-</dd></div>
      <div><dt>Changed files</dt><dd id="changed">None reported yet</dd></div>
    </dl></aside>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const jobId = params.get('job') || '';
    const monitorToken = params.get('monitorToken') || '';
    const els = Object.fromEntries(['title','workspace','status','statusText','events','final','operation','project','repository','branch','started','changed'].map(id => [id, document.getElementById(id)]));
    let cursor = 0;
    let rendered = 0;
    function text(value) { return String(value == null ? '' : value); }
    function eventSummary(event) {
      const data = event.data && typeof event.data === 'object' ? event.data : {};
      const item = data.item && typeof data.item === 'object' ? data.item : {};
      return text(item.text || data.text || data.message || data.command || data.status || (Object.keys(data).length ? JSON.stringify(data) : ''));
    }
    function renderEvent(event) {
      if (!rendered) els.events.textContent = '';
      rendered += 1;
      const row = document.createElement('div');
      row.className = 'event';
      const time = document.createElement('time');
      time.textContent = new Date(event.timestamp || Date.now()).toLocaleTimeString();
      const kind = document.createElement('strong');
      kind.textContent = text(event.type || 'event');
      const body = document.createElement('pre');
      body.textContent = eventSummary(event);
      row.append(time, kind, body);
      els.events.append(row);
      cursor = Math.max(cursor, Number(event.sequence) || 0);
      if (els.events.children.length > 300) els.events.firstElementChild.remove();
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
    function render(job) {
      document.title = `${job.projectName || 'Marcus'} - Codex`;
      els.title.textContent = job.projectName ? `${job.projectName} - Codex` : 'Marcus Codex Run';
      els.workspace.textContent = job.workspacePath || 'Local workspace';
      els.status.className = `status ${job.status || ''}`;
      els.statusText.textContent = job.status || 'unknown';
      els.operation.textContent = job.operationId || '-';
      els.project.textContent = job.projectName || '-';
      els.repository.textContent = job.repository || 'Local only';
      els.branch.textContent = job.branch || '-';
      els.started.textContent = job.startedAt ? new Date(job.startedAt).toLocaleString() : '-';
      els.changed.textContent = Array.isArray(job.changedFiles) && job.changedFiles.length ? job.changedFiles.join('\n') : 'None reported yet';
      if (job.finalOutput) els.final.textContent = job.finalOutput;
      (job.events || []).forEach(renderEvent);
    }
    async function poll() {
      try {
        const response = await fetch(`/api/codex-monitor/jobs/${encodeURIComponent(jobId)}?monitorToken=${encodeURIComponent(monitorToken)}&after=${cursor}`, { cache: 'no-store' });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || `Monitor error ${response.status}`);
        render(data.job);
      } catch (error) {
        els.status.className = 'status failed';
        els.statusText.textContent = 'disconnected';
        els.workspace.textContent = error.message;
      } finally {
        setTimeout(poll, 1000);
      }
    }
    if (!jobId || !monitorToken) { els.workspace.textContent = 'This monitor link is incomplete.'; els.statusText.textContent = 'unavailable'; }
    else poll();
  </script>
</body>
</html>
