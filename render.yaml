services:
  - type: web
    name: task-tracker
    env: node
    plan: starter
    autoDeploy: true
    buildFilter:
      ignoredPaths:
        - docs/**
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: BASE_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: TASK_TRACKER_DATA_DIR
        value: /var/data/task-tracker/data
      - key: TASK_TRACKER_SETTINGS_DIR
        value: /var/data/task-tracker/settings
      - key: TASK_TRACKER_BACKUP_DIR
        value: /var/data/task-tracker/backups
      - key: TASK_TRACKER_BACKUP_INTERVAL_MINUTES
        value: 60
      - key: TASK_TRACKER_BACKUP_RETENTION_DAYS
        value: 14
      - key: TASK_TRACKER_BACKUP_MAX_FILES_PER_PREFIX
        value: 72
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: FIREFLIES_SECRET
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: QUO_WEBHOOK_TOKEN
        sync: false
      - key: QUO_API_KEY
        sync: false
      - key: QUO_DEFAULT_PHONE_NUMBER_ID
        sync: false
      - key: QUO_FROM_NUMBER
        sync: false
      - key: QUO_USER_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_ADDRESS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: ELEVENLABS_MODEL_ID
        value: eleven_flash_v2_5
      - key: ELEVENLABS_OUTPUT_FORMAT
        value: mp3_44100_128
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        value: markgromer
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_DEFAULT_ZONE_ID
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: MARCUS_CODEX_GITHUB_ACTIONS_ENABLED
        value: true
      - key: MARCUS_CODEX_GITHUB_TOKEN
        sync: false
      - key: MARCUS_CODEX_RUNNER_REPO
        value: markgromer/Reggie
    disk:
      name: task-tracker-data
      mountPath: /var/data/task-tracker
      sizeGB: 2
