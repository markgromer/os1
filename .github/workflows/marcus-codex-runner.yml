name: Marcus Codex Runner

run-name: Marcus Codex ${{ github.event.client_payload.jobId || inputs.job_id || github.run_id }}

on:
  repository_dispatch:
    types: [marcus_codex_job]
  workflow_dispatch:
    inputs:
      job_id:
        description: Marcus Codex job id
        required: true
        type: string
      repository:
        description: Target repository in owner/name form
        required: true
        type: string
      branch:
        description: Work branch
        required: true
        type: string
      prompt:
        description: Codex prompt
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: marcus-codex-${{ github.event.client_payload.jobId || inputs.job_id }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JOB_ID: ${{ github.event.client_payload.jobId || inputs.job_id }}
      OPERATION_ID: ${{ github.event.client_payload.operationId || '' }}
      TARGET_REPOSITORY: ${{ github.event.client_payload.repository || inputs.repository }}
      WORK_BRANCH: ${{ github.event.client_payload.branch || inputs.branch }}
      WORKFLOW_PROMPT: ${{ inputs.prompt || '' }}
      MARCUS_GITHUB_TOKEN: ${{ secrets.MARCUS_GITHUB_TOKEN || github.token }}
      MARCUS_OPENAI_API_KEY: ${{ secrets.MARCUS_OPENAI_API_KEY || secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ secrets.MARCUS_GITHUB_TOKEN || github.token }}

    steps:
      - name: Validate request
        run: |
          set -euo pipefail
          test -n "$JOB_ID"
          test -n "$TARGET_REPOSITORY"
          test -n "$WORK_BRANCH"
          test -n "$MARCUS_OPENAI_API_KEY"
          if ! printf '%s' "$TARGET_REPOSITORY" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
            echo "Target repository must be owner/name." >&2
            exit 1
          fi
          if ! printf '%s' "$WORK_BRANCH" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo "Work branch is invalid." >&2
            exit 1
          fi

      - name: Check out target repository
        uses: actions/checkout@v5
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          token: ${{ env.MARCUS_GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare branch and prompt
        run: |
          set -euo pipefail
          git config user.name "marcus-codex[bot]"
          git config user.email "marcus-codex[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${MARCUS_GITHUB_TOKEN}@github.com/${TARGET_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin "$WORK_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$WORK_BRANCH:$WORK_BRANCH"
            git checkout "$WORK_BRANCH"
          else
            git checkout -b "$WORK_BRANCH"
          fi
          node - <<'NODE'
          const fs = require("fs");
          const payloadPrompt = process.env.GITHUB_EVENT_PATH
            ? (JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8")).client_payload?.prompt || "")
            : "";
          const prompt = payloadPrompt || process.env.WORKFLOW_PROMPT || "";
          if (!prompt || prompt.length < 12) {
            throw new Error("Marcus Codex prompt is missing.");
          }
          fs.writeFileSync(".marcus-codex-prompt.md", prompt);
          NODE

      - name: Run Codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ env.MARCUS_OPENAI_API_KEY }}
          prompt-file: .marcus-codex-prompt.md
          output-file: marcus-codex-output.md
          sandbox: workspace-write
          safety-strategy: drop-sudo

      - name: Commit and open pull request
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          rm -f .marcus-codex-prompt.md
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Codex produced no repository changes."
            exit 0
          fi
          git add -A
          git commit -m "Marcus Codex job $JOB_ID"
          git push origin "$WORK_BRANCH"
          existing_pr=$(gh pr list --repo "$TARGET_REPOSITORY" --head "$WORK_BRANCH" --json url --jq '.[0].url // ""')
          if [ -n "$existing_pr" ]; then
            echo "Pull request already exists: $existing_pr"
          else
            gh pr create \
              --repo "$TARGET_REPOSITORY" \
              --head "$WORK_BRANCH" \
              --title "Marcus Codex job $JOB_ID" \
              --body "Created by Marcus from operation ${OPERATION_ID:-unknown}.\n\nRunner: $RUN_URL"
          fi
